<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>
</head>
<body>
    <div id="criarCarro" class="criarCarro">
        <div class="campoForm">
            <label for="f_nome">Nome</label>
            <input type="text" name="f_nome" id="f_name" value="">
        </div>
        <div class="campoForm">
            <label for="f_portas">Portas</label>
            <input type="number" name="f_portas" id="f_name" value="0">
        </div>
        <div class="campoForm">
            <label for="f_blindagem">Blindagem</label>
            <input type="number" name="f_blindagem" id="f_blindagem" disabled value="0">
        </div>
        <div class="campoForm">
            <label for="f_municao">Munição</label>
            <input type="number" id="f_municao" name="f_municao" disabled value="0">
        </div>
        <div class="campoForm">
            <label for="f_tipo">Tipo</label>
            <div class="radio"></div>
            <input type="radio" name="f_tipo" id="f_tipo" value="m">
        </div>
        <div class="campoForm"></div>
        <div class="campoForm"></div>
    </div>
</body>
</html>
